[project]
name = "garmin-grafana"
version = "0.1.0"
description = "Fetch Garmin data and visualize it in Grafana"
readme = "README.md"
authors = [
    { name = "Tim Martin", email = "tim@timmart.in" }
]
requires-python = ">=3.14"
dependencies = [
    "fitdecode>=0.11.0",
    "garminconnect>=0.3.17",
    "httpx2>=2.13.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
garmin-grafana = "garmin_grafana:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

[tool.ruff]
target-version = "py314"
extend-exclude = [".work"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ty.src]
include = ["src", "tests"]
